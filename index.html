<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grabador HCC-DGCV · MVP-03.2C</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#111827;background:#f3f4f6}
    body{margin:0;padding:24px}
    .card{max-width:760px;margin:0 auto;background:#fff;border:1px solid #d1d5db;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(15,23,42,.08)}
    h1{font-size:22px;margin:0 0 6px}
    .muted{color:#64748b;font-size:14px}
    .status{margin:16px 0;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    #start{background:#2563eb;color:#fff}
    #pause,#stop,#download{background:#e2e8f0;color:#0f172a}
    #timer{font-size:24px;font-weight:700;min-width:105px}
    audio{width:100%;margin-top:16px}
    .ok{color:#166534}.warn{color:#92400e}.err{color:#991b1b}
  </style>
</head>
<body>
  <main class="card">
    <h1>Grabador HCC-DGCV</h1>
    <div class="muted">MVP-03.2C · Grabación externa segura para el Sistema HCC-DGCV</div>

    <div id="state" class="status">Audio: NO INICIADO</div>

    <div class="row">
      <button id="start">Iniciar grabación</button>
      <button id="pause" disabled>Pausar</button>
      <button id="stop" disabled>Finalizar</button>
      <span id="timer">00:00:00</span>
    </div>

    <p id="info" class="muted">El navegador solicitará permiso para utilizar el micrófono.</p>
    <audio id="player" controls></audio>
    <div class="row" style="margin-top:12px">
      <button id="download" disabled>Descargar WebM</button>
    </div>
  </main>

<script>
let recorder=null,stream=null,chunks=[],startedAt=0,pausedAt=0,pausedTotal=0,timerId=null,blob=null,audioUrl=null;
const $=id=>document.getElementById(id);
function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
function elapsed(){if(!startedAt)return 0;const now=Date.now();let p=pausedTotal;if(pausedAt)p+=now-pausedAt;return (now-startedAt-p)/1000}
function tick(){$('timer').textContent=fmt(elapsed())}
function mime(){const c=['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];return c.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||''}
function cleanupStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$('start').onclick=async()=>{
  try{
    if(!window.isSecureContext)throw new Error('Se requiere un contexto HTTPS seguro.');
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('El navegador no ofrece acceso al micrófono.');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
    chunks=[];blob=null;const mt=mime();recorder=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
    recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    recorder.onstop=()=>{
      blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      if(audioUrl)URL.revokeObjectURL(audioUrl);
      audioUrl=URL.createObjectURL(blob);$('player').src=audioUrl;$('download').disabled=false;cleanupStream();
      $('state').textContent='Audio: GRABACIÓN FINALIZADA';$('state').className='status ok';
      $('info').textContent='Reproduzca el audio para verificarlo y luego descargue el archivo WebM para subirlo al HCC.';
    };
    startedAt=Date.now();pausedAt=0;pausedTotal=0;recorder.start(1000);timerId=setInterval(tick,500);
    $('start').disabled=true;$('pause').disabled=false;$('stop').disabled=false;$('state').textContent='Audio: GRABANDO';$('state').className='status';$('info').textContent='Formato: '+(recorder.mimeType||mt||'predeterminado');tick();
  }catch(e){cleanupStream();$('state').textContent='Audio: ERROR';$('state').className='status err';$('info').textContent=(e.name?e.name+': ':'')+(e.message||String(e));console.error(e)}
};
$('pause').onclick=()=>{if(!recorder)return;if(recorder.state==='recording'){recorder.pause();pausedAt=Date.now();$('pause').textContent='Reanudar';$('state').textContent='Audio: PAUSADO'}else if(recorder.state==='paused'){recorder.resume();pausedTotal+=Date.now()-pausedAt;pausedAt=0;$('pause').textContent='Pausar';$('state').textContent='Audio: GRABANDO'}};
$('stop').onclick=()=>{if(!recorder||recorder.state==='inactive')return;if(recorder.state==='paused')recorder.resume();recorder.stop();if(timerId)clearInterval(timerId);timerId=null;tick();$('start').disabled=false;$('pause').disabled=true;$('stop').disabled=true;$('pause').textContent='Pausar'};
$('download').onclick=()=>{if(!blob)return;const ext=blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')?'m4a':'webm';const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HCC_DGCV_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
</body>
</html>
